{% extends "tickets/base.html" %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Welcome back</h1>

            <p>
                Sign in to access your ticket workspace.
            </p>

        </div>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="primary-button full-button"
            >
                Sign in
            </button>

        </form>

    </div>

</div>

{% endblock %}
